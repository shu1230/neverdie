<!-- index_4.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>₊˚⊹ 마음의 대화 ⋆⑅˚₊</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mobile-app">

        <!-- 1️⃣ 메인 프로필 카드 화면 -->
        <div id="screen-1" class="screen active">
            <div class="profile-card">
                <div class="profile-img-box">
                    <img id="main-profile-img" src="profile.png" alt="Profile" class="artist-photo" onerror="this.src='https://via.placeholder.com/300x300?text=Profile+Photo'">
                </div>

                <div class="card-info">
                    <div class="doodle-box">
                        <img src="doodle.png" alt="doodle" class="doodle-img" onerror="this.style.display='none'">
                    </div>
                    <h2 id="main-artist-name" class="artist-name">•૦•💗💗💗</h2>
                    <span id="main-status-msg" class="music-icon">맘모스~🐘</span>
                    <button id="start-chat-btn" class="chat-start-btn">대화하기</button>
                </div>
            </div>
        </div>

        <!-- 2️⃣ 실시간 채팅 화면 -->
        <div id="screen-2" class="screen chat-screen">
            
            <!-- 상단 헤더 -->
            <header class="chat-header">
                <button id="back-btn" class="header-btn">
                    <img src="icon-back.png" alt="back" class="icon-img" onerror="this.style.display='none'; this.parentNode.innerText='‹'">
                </button>
                
                <div class="header-profile">
                    <img id="header-profile-img" src="profile.png" alt="Profile" class="header-thumb" onerror="this.src='https://via.placeholder.com/40'">
                    <span id="header-artist-name" class="header-name">•૦•💗💗💗</span>
                </div>
                
                <!-- 🟢 더보기 버튼 (비밀번호 인증 후 관리자 메뉴 실행) -->
                <button id="more-btn" class="header-btn">
                    <img src="icon-more.png" alt="more" class="icon-img" onerror="this.style.display='none'; this.parentNode.innerText='⋮'">
                </button>
            </header>

            <!-- 메시지 영역 -->
            <div id="chat-messages" class="chat-messages"></div>

            <!-- 하단 입력창 -->
            <footer class="chat-footer">
                <form id="chat-form" class="input-form">
                    <!-- 숨겨진 채팅 전용 이미지 파일 인풋 -->
                    <input type="file" id="chat-image-input" accept="image/*" style="display: none;">
                    
                    <textarea id="message-input" placeholder="메시지를 입력해 주세요." rows="1" autocomplete="off"></textarea>
                    <button type="submit" class="send-btn" id="send-btn">
                        <img src="icon-send.png" alt="send" class="send-icon-img" onerror="this.style.display='none'; this.parentNode.innerText='➤'">
                    </button>
                </form>
            </footer>

        </div>

        <!-- 🟢 관리자 설정 메뉴 바텀시트 -->
        <div id="menu-sheet" class="modal-overlay bottom-sheet-overlay hidden">
            <div class="bottom-sheet">
                <div class="sheet-handle"></div>
                <!-- 이미지 파일 선택 태그 (숨김) -->
                <input type="file" id="file-input-profile" accept="image/*" style="display: none;">
                
                <button id="btn-change-artist-name" class="sheet-btn">이름 설정</button>
                <button id="btn-change-status-msg" class="sheet-btn">상태 메시지 설정</button>
                <button id="btn-change-profile-img" class="sheet-btn">프로필 이미지 설정</button>
                <button id="btn-toggle-artist" class="sheet-btn highlight">답장/삭제</button>
                <button id="btn-delete-guide" class="sheet-btn">메시지 삭제 방법 안내</button>
                <button id="close-sheet-btn" class="sheet-btn cancel">취소</button>
            </div>
        </div>

        <!-- 🟢 관리자 전송 옵션 바텀시트 (텍스트 vs 이미지 선택) -->
        <div id="send-option-sheet" class="modal-overlay bottom-sheet-overlay hidden">
            <div class="bottom-sheet">
                <div class="sheet-handle"></div>
                <button id="btn-send-text" class="sheet-btn highlight">메시지 전송</button>
                <button id="btn-send-image" class="sheet-btn">사진 첨부 및 전송</button>
                <button id="close-send-option-btn" class="sheet-btn cancel">취소</button>
            </div>
        </div>

    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
